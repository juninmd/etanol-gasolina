name: Atualizar preços ANP

on:
  schedule:
    # Diário: a ANP publica uma vez por semana, mas o dia varia; sem novidade nada é commitado.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositório
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Baixar preços da ANP e atualizar o histórico
        # node:sqlite exige Node 22.5+; o Node padrão do runner é mais antigo.
        run: npx -y node@22 --no-warnings scripts/atualizar-precos.js

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- data && [ -z "$(git status --porcelain data)" ]; then
            echo "Sem novos preços."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: atualiza preços e postos da ANP"
          git push
